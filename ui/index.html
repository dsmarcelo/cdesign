<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111113">
<title>cdesign</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("cd-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch{}</script>
<style>
  html{background:#111113;overscroll-behavior:none}
  :root{color-scheme:dark;--bg:#111113;--panel:#18181b;--line:#27272a;--mut:#a1a1aa;--acc:#2563eb}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;height:100dvh;display:grid;grid-template-columns:var(--lw,230px) 1fr var(--rw,300px);grid-template-rows:44px 1fr;background:var(--bg);color:#fafafa;font:13px system-ui}
  header{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line)}
  header b{margin-right:auto}
  #agent{font-size:12px;color:var(--mut);margin-right:8px} #agent::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#52525b;margin-right:6px} #agent.on{color:#fafafa} #agent.on::before{background:#22c55e}
  button{background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
  button.on{background:var(--acc);border-color:var(--acc)}
  aside{overflow:auto;padding:8px;background:var(--panel)}
  aside.l{grid-area:2/1} main{grid-area:2/2} aside.r{grid-area:2/3}
  body.hl{--lw:0px} body.hr{--rw:0px} body.hl aside.l,body.hr aside.r{display:none}
  .grp{display:inline-flex;gap:4px}
  header button.ic{padding:5px 7px;line-height:0} header button.ic svg{width:16px;height:16px}
  aside.l{border-right:1px solid var(--line)} aside.r{border-left:1px solid var(--line)}
  details{margin:0}
  summary{list-style:none;cursor:pointer;padding:6px 8px;border-radius:6px;color:#fafafa;font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px;user-select:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--mut);border-bottom:1.5px solid var(--mut);transform:rotate(-45deg);transition:transform .12s;margin:0 2px}
  details[open]>summary::before{transform:rotate(45deg)}
  summary:hover{background:var(--line)}
  .kids{margin-left:10px;padding-left:6px;border-left:1px solid var(--line)}
  .f{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;color:var(--mut)}
  .f:hover,.f.sel{background:var(--line);color:#fff}
  main{display:flex;justify-content:center;overflow:auto;padding:12px}
  iframe{border:1px solid var(--line);background:#fff;border-radius:8px;height:100%;width:100%;display:block}
  #stage{display:flex;gap:12px;justify-content:center;width:100%;height:100%;min-width:0}
  .dev{position:relative;height:100%;width:100%;min-width:0} #d2{display:none}
  body.split #d1{width:390px;flex:0 1 390px} body.split #d2{display:block;flex:1 1 0;width:auto}
  body.resp #stage{justify-content:flex-start;align-items:flex-start} body.resp #d1{flex:none}
  .rh{display:none;position:absolute;z-index:3;touch-action:none} body.resp .rh{display:block}
  .rh::after{content:"";position:absolute;background:var(--mut);border-radius:2px;opacity:.5} .rh:hover::after,body.drag .rh::after{opacity:1;background:var(--acc)}
  #rx{top:0;bottom:0;right:-11px;width:11px;cursor:ew-resize} #rx::after{left:4px;top:calc(50% - 16px);width:3px;height:32px}
  #ry{left:0;right:0;bottom:-11px;height:11px;cursor:ns-resize} #ry::after{top:4px;left:calc(50% - 16px);height:3px;width:32px}
  #rxy{right:-11px;bottom:-11px;width:14px;height:14px;cursor:nwse-resize} #rxy::after{right:3px;bottom:3px;width:7px;height:7px;border-radius:0 0 2px 0;background:none;border-right:3px solid var(--mut);border-bottom:3px solid var(--mut)}
  #dim{display:none;position:absolute;right:8px;bottom:8px;z-index:3;background:#000c;color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;pointer-events:none;font-variant-numeric:tabular-nums} body.resp #dim{display:block}
  body.drag{user-select:none} body.drag iframe{pointer-events:none}
  html[data-theme=dark] iframe{background:#000}
  .c{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
  .c small{display:block;color:var(--mut);font-size:11px;margin-bottom:4px;word-break:break-all}
  .c.done{opacity:.45}
  .c button{padding:2px 8px;margin-top:6px;margin-right:4px;font-size:11px}
  .st{font-size:10px;text-transform:uppercase;color:var(--acc)}
  .c.queued .st,.c.sent .st{color:var(--mut)}
  button.go{background:var(--acc);border-color:var(--acc)} button:disabled{opacity:.4;cursor:default}
  select{background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;max-width:220px}
  #pick{position:fixed;inset:0;background:var(--bg);display:none;place-content:center;gap:8px;padding:24px;z-index:9;width:min(480px,100%);margin:auto;align-content:center}
  body.nop #pick{display:grid} body.nop>:not(#pick):not(#toast){display:none}
  #pick h2{margin:0 0 8px;font-size:16px} #pick .f{border:1px solid var(--line);color:#fafafa} #pick small{color:var(--mut)}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#fafafa;color:#111;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw}
  #toast.on{opacity:1}
  #bar{display:contents} #more,#bb{display:none}
  @media (max-width:700px){
    body{grid-template-columns:1fr;grid-template-rows:44px 1fr}
    header{grid-column:1;position:relative}
    header b{margin-right:auto}
    #more{display:inline-flex} #more.on{background:var(--acc);border-color:var(--acc)}
    #bar{display:none;position:absolute;top:100%;left:0;right:0;z-index:20;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
    body.bar #bar{display:flex}
    #bar #proj{flex:1 1 140px;max-width:none} #bar #agent{flex:1 1 100%;order:-1;margin:0}
    aside.l,aside.r{position:fixed;top:44px;bottom:0;z-index:10;width:min(300px,85vw)}
    aside.l{left:0} aside.r{right:0}
    main{grid-area:2/1;padding:0}
    iframe{border:0;border-radius:0}
    aside.l,aside.r{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
    body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    aside.l,aside.r{top:calc(44px + env(safe-area-inset-top));bottom:env(safe-area-inset-bottom)}
    aside.l{left:env(safe-area-inset-left)} aside.r{right:env(safe-area-inset-right)}
    #bb{display:inline-flex}
    body.bb{grid-template-rows:1fr 44px}
    body.bb header{grid-area:2/1;border-bottom:0;border-top:1px solid var(--line)}
    body.bb main{grid-area:1/1}
    body.bb #bar{top:auto;bottom:100%;border-bottom:0;border-top:1px solid var(--line)}
    body.bb aside.l,body.bb aside.r{top:env(safe-area-inset-top);bottom:calc(44px + env(safe-area-inset-bottom))}
  }
</style>
<header>
  <button id="tl" class="ic on" title="Hide/show files"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M6 3v10"/></svg></button>
  <b>cdesign</b>
  <button id="more" class="ic" title="Show/hide toolbar"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg></button>
  <div id="bar">
  <select id="proj" title="Switch project"></select>
  <span id="agent" title="Is an agent running `cdesign wait`?"></span>
  <span id="w" class="grp"><button class="ic on" data-w="100%" title="Full width"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="3" width="12.5" height="8" rx="1.5"/><path d="M5.5 13.5h5"/></svg></button><button class="ic" data-w="768px" title="Tablet (768px)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="1.75" width="10" height="12.5" rx="1.5"/><path d="M7 12.25h2"/></svg></button><button class="ic" data-w="390px" title="Mobile (390px)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="1.75" width="7" height="12.5" rx="1.5"/><path d="M7 12.25h2"/></svg></button><button class="ic" data-w="resp" title="Responsive: drag the edges to resize width and height"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="2.75" width="9.5" height="9.5" rx="1.5"/><path d="M14.25 7.5v6.75H7.5M10.5 14.25l3.75-3.75"/></svg></button><button class="ic" data-w="split" title="Split: mobile on the left, full width on the right"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="3.25" width="4" height="9.5" rx="1"/><rect x="7.75" y="3.25" width="6.5" height="9.5" rx="1"/></svg></button></span>
  <button id="bb" title="Move the toolbar to the bottom/top of the screen">Toolbar: top</button>
  <button id="theme" title="Toggle light/dark preview">Light</button>
  <button id="sel" class="ic" title="Select element for the agent (S)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3.5 2.5l9 4.2-3.9 1.3-1.3 3.9z"/><path d="M8.6 8l3 3.2"/></svg></button>
  <button id="mode">Comment (C)</button>
  <button id="send" class="go" disabled>Send to agent</button>
  <button id="tr" class="ic on" title="Hide/show comments"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M10 3v10"/></svg></button>
  </div>
</header>
<aside class="l" id="files"></aside>
<main><div id="stage">
  <div class="dev" id="d1"><iframe id="fr"></iframe><i class="rh" id="rx"></i><i class="rh" id="ry"></i><i class="rh" id="rxy"></i><span id="dim"></span></div>
  <div class="dev" id="d2"><iframe id="fr2"></iframe></div>
</div></main>
<aside class="r" id="cm"></aside>
<div id="pick"></div>
<div id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
let cur = location.hash.slice(1) || null, mode = null; // mode: null | "select" | "comment"
const tabId = Math.random().toString(36).slice(2, 10);
// tell the server which page this tab shows; the agent reads it through `cdesign page`
const report = () => fetch("/__cd/page", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ tabId, file: cur }), keepalive: true }).catch(() => {});
function setCur(p) { cur = p; if (location.hash.slice(1) !== p) location.hash = p; files(); load(); report(); }

// folders start closed; the ones the user opens stay open across redraws and reloads of this tab (sessionStorage: per tab, gone when it closes)
const opened = new Set((() => { try { return JSON.parse(sessionStorage.getItem("cd-opened") || "[]"); } catch { return []; } })());
const saveOpened = () => { try { sessionStorage.setItem("cd-opened", JSON.stringify([...opened])); } catch { /* storage unavailable */ } };

function tree(list) {
  const root = { dirs: {}, files: [] };
  for (const f of list) {
    const parts = f.split("/"), name = parts.pop();
    let n = root;
    for (const p of parts) n = n.dirs[p] ??= { dirs: {}, files: [] };
    n.files.push({ name, path: f });
  }
  return root;
}

function draw(n, el, prefix) {
  for (const [name, d] of Object.entries(n.dirs).sort(([a], [b]) => a.localeCompare(b))) {
    let label = name, node = d;
    while (!node.files.length && Object.keys(node.dirs).length === 1) { // compact single-child chains
      const [k, v] = Object.entries(node.dirs)[0];
      label += "/" + k; node = v;
    }
    const key = prefix + label;
    const det = document.createElement("details");
    det.open = opened.has(key);
    det.ontoggle = () => { det.open ? opened.add(key) : opened.delete(key); saveOpened(); };
    const sum = document.createElement("summary");
    sum.textContent = label;
    const kids = document.createElement("div");
    kids.className = "kids";
    det.append(sum, kids);
    el.appendChild(det);
    draw(node, kids, key + "/");
  }
  for (const f of n.files.sort((a, b) => a.name.localeCompare(b.name))) {
    const b = document.createElement("button");
    b.className = "f" + (f.path === cur ? " sel" : "");
    b.textContent = f.name;
    b.title = f.path;
    b.onclick = () => { setCur(f.path); if (mob.matches) { mstate["cd-hide-l"] = true; panels(); } };
    el.appendChild(b);
  }
}

async function files() {
  const l = await (await fetch("/__cd/files")).json();
  const had = cur;
  if (!cur || !l.includes(cur)) cur = l[0] ?? null;
  if (cur !== had) report();
  $("#files").innerHTML = "";
  draw(tree(l), $("#files"), "");
  if (!l.length) $("#files").textContent = "No preview entries. Add a page or component preview.";
}
const frames = () => [$("#fr"), $("#fr2")];
const load = () => { if (cur) { $("#fr").src = "/p/" + cur; if (view === "split") $("#fr2").src = "/p/" + cur; } };
const send = (m) => frames().forEach((f) => f.contentWindow?.postMessage(m, "*"));
const sync = () => { send({ cd: "mode", mode, tab: tabId }); send({ cd: "pins" }); };

async function comments() {
  const l = await (await fetch("/__cd/comments")).json();
  const drafts = l.filter((c) => c.status === "draft").length;
  $("#send").disabled = !drafts;
  $("#send").textContent = drafts ? `Send to agent (${drafts})` : "Send to agent";
  $("#cm").innerHTML = l.length ? "" : '<small style="color:var(--mut)">No comments yet. Toggle Comment and click an element.</small>';
  for (const c of l) {
    const d = document.createElement("div");
    d.className = "c " + c.status;
    d.innerHTML = `<span class="st"></span><small></small><div></div>`;
    d.querySelector(".st").textContent = c.status;
    d.querySelector("small").textContent = `${c.file}:${c.cdId}`;
    d.querySelector("div").textContent = c.text;
    const mk = (t, p) => { const b = document.createElement("button"); b.textContent = t; b.onclick = () => fetch(`/__cd/comments/${c.id}/${p}`, { method: "POST" }); d.appendChild(b); };
    mk(c.status === "done" ? "Reopen" : "Done", c.status === "done" ? "open" : "done");
    mk("Delete", "delete");
    d.onclick = (e) => { if (e.target.tagName !== "BUTTON" && c.file !== cur) setCur(c.file); };
    $("#cm").appendChild(d);
  }
}

let agentOn = false;
async function agent() {
  agentOn = (await (await fetch("/__cd/agent")).json()).listening;
  const working = !agentOn && (await (await fetch("/__cd/comments")).json()).some((c) => c.status === "sent");
  $("#agent").className = agentOn ? "on" : "";
  $("#agent").textContent = agentOn ? "Agent listening" : working ? "Agent working" : "No agent listening";
}
const PROMPT = "Run `cdesign review` and apply the comments I sent in the cdesign viewer.";
function toast(t) { $("#toast").textContent = t; $("#toast").classList.add("on"); setTimeout(() => $("#toast").classList.remove("on"), 4000); }
$("#send").onclick = async () => {
  const { queued } = await (await fetch("/__cd/send", { method: "POST" })).json();
  let copied = false;
  try { await navigator.clipboard.writeText(PROMPT); copied = true; } catch {}
  await agent();
  toast(agentOn ? `${queued} comment(s) sent to the listening agent.` : `${queued} comment(s) queued, no agent is listening. ` + (copied ? "Prompt copied: paste it in your agent." : "Tell your agent: " + PROMPT));
};

// phones: panels are overlays, closed by default, kept in memory only; desktop keeps its choice in localStorage
const mob = matchMedia("(max-width:700px)"), mstate = {};
const hidden = (k) => { if (mob.matches) return mstate[k] !== false; try { return localStorage.getItem(k) === "1"; } catch { return false; } };
function panel(btn, cls, key, toggleIt) {
  if (toggleIt) {
    const h = hidden(key);
    if (mob.matches) mstate[key] = !h; else { try { localStorage.setItem(key, h ? "0" : "1"); } catch {} }
  }
  document.body.classList.toggle(cls, hidden(key));
  $(btn).classList.toggle("on", !hidden(key));
}
const panels = () => { panel("#tl", "hl", "cd-hide-l"); panel("#tr", "hr", "cd-hide-r"); };
$("#tl").onclick = () => { if (mob.matches) mstate["cd-hide-r"] = true; panel("#tl", "hl", "cd-hide-l", true); panels(); };
$("#tr").onclick = () => { if (mob.matches) mstate["cd-hide-l"] = true; panel("#tr", "hr", "cd-hide-r", true); panels(); };
$("#more").onclick = () => $("#more").classList.toggle("on", document.body.classList.toggle("bar"));
const bb = () => { let on = false; try { on = localStorage.getItem("cd-bar-bottom") === "1"; } catch {} document.body.classList.toggle("bb", on); $("#bb").textContent = on ? "Toolbar: bottom" : "Toolbar: top"; return on; };
$("#bb").onclick = () => { try { localStorage.setItem("cd-bar-bottom", bb() ? "0" : "1"); } catch {} bb(); };
bb();
mob.addEventListener("change", panels);
panels();

const theme = () => { try { return localStorage.getItem("cd-theme"); } catch { return null; } };
const current = () => theme() || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function applyTheme() {
  const t = current();
  document.documentElement.dataset.theme = t;
  $("#theme").textContent = t === "dark" ? "Dark" : "Light";
  $("#theme").classList.toggle("on", t === "dark");
  for (const f of frames()) try { f.contentDocument.documentElement.setAttribute("data-theme", t); } catch {}
}
$("#theme").onclick = () => {
  try { localStorage.setItem("cd-theme", current() === "dark" ? "light" : "dark"); } catch {}
  applyTheme();
};
function setMode(m) {
  mode = mode === m ? null : m;
  $("#mode").classList.toggle("on", mode === "comment");
  $("#sel").classList.toggle("on", mode === "select");
  if (mode !== "select") send({ cd: "clear" }); // the agent only sees a selection while Select is active
  sync();
}
$("#mode").onclick = () => setMode("comment");
$("#sel").onclick = () => setMode("select");
// preview size persists across reloads of this tab (sessionStorage): a preset width, "resp" (free width x height) or "split" (phone + full)
let view = "100%", rs = { w: 800, h: 600 };
const store = (k, v) => { try { sessionStorage.setItem(k, v); } catch { /* storage unavailable */ } };
const dim = () => { $("#dim").textContent = `${Math.round(rs.w)} × ${Math.round(rs.h)}`; };
const size = () => { const d = $("#d1"); d.style.width = view === "resp" ? rs.w + "px" : view === "split" ? "" : view; d.style.height = view === "resp" ? rs.h + "px" : ""; dim(); };
const setWidth = (w) => {
  if (w === "resp" && view !== "resp") { const r = $("#d1").getBoundingClientRect(); if (!rs.set) rs = { w: Math.round(r.width) || rs.w, h: Math.round(r.height) || rs.h }; }
  view = w;
  document.querySelectorAll("#w button").forEach((x) => x.classList.toggle("on", x.dataset.w === w));
  document.body.classList.toggle("resp", w === "resp");
  document.body.classList.toggle("split", w === "split");
  size();
  if (w === "split") { if (cur) $("#fr2").src = "/p/" + cur; } else if ($("#fr2").src && $("#fr2").src !== "about:blank") $("#fr2").src = "about:blank";
  store("cd-width", w);
};
document.querySelectorAll("#w button").forEach((b) => (b.onclick = () => setWidth(b.dataset.w)));
try { const r = (sessionStorage.getItem("cd-resp") || "").split("x").map(Number); if (r[0] >= 200 && r[1] >= 200) rs = { w: r[0], h: r[1], set: true }; } catch { /* storage unavailable */ }
try { const w = sessionStorage.getItem("cd-width"); if (w && document.querySelector(`#w button[data-w="${w}"]`)) setWidth(w); } catch { /* storage unavailable */ }
// drag the edges of the responsive frame (iframes ignore the pointer meanwhile so the drag is not swallowed)
for (const [id, dx, dy] of [["rx", 1, 0], ["ry", 0, 1], ["rxy", 1, 1]]) {
  const h = $("#" + id);
  h.onpointerdown = (e) => {
    e.preventDefault();
    h.setPointerCapture(e.pointerId);
    document.body.classList.add("drag");
    const x0 = e.clientX, y0 = e.clientY, w0 = rs.w, h0 = rs.h;
    h.onpointermove = (m) => {
      if (dx) rs.w = Math.max(200, Math.min(4000, w0 + m.clientX - x0));
      if (dy) rs.h = Math.max(200, Math.min(4000, h0 + m.clientY - y0));
      rs.set = true;
      size();
    };
    h.onpointerup = h.onpointercancel = () => { h.onpointermove = h.onpointerup = h.onpointercancel = null; document.body.classList.remove("drag"); store("cd-resp", `${Math.round(rs.w)}x${Math.round(rs.h)}`); };
  };
}
addEventListener("keydown", (e) => {
  if (/input|textarea/i.test(e.target.tagName)) return;
  if (e.key === "c") setMode("comment");
  if (e.key === "s") setMode("select");
  if (e.key === "Escape") send({ cd: "clear" });
});
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== cur) setCur(h); });
addEventListener("focus", report);
document.addEventListener("visibilitychange", () => { if (!document.hidden) report(); });
addEventListener("message", (e) => { if (e.data?.cd === "ready") sync(); });
frames().forEach((f) => f.addEventListener("load", () => { sync(); applyTheme(); }));

async function addFolder() {
  const root = prompt("Absolute path of the project folder");
  if (!root) return;
  const setupResponse = await fetch("/__cd/setup?root=" + encodeURIComponent(root));
  const setup = await setupResponse.json();
  if (!setupResponse.ok) return alert(setup.error);
  const options = {};
  if (!setup.existing) {
    const mode = prompt("Project mode: react or html", "react");
    if (mode === null) return;
    if (!["react", "html"].includes(mode.trim().toLowerCase())) return alert("Choose react or html");
    options.mode = mode.trim().toLowerCase();
    const tailwind = prompt("Use Tailwind CSS? yes or no", "yes");
    if (tailwind === null) return;
    if (!["yes", "no", "y", "n"].includes(tailwind.trim().toLowerCase())) return alert("Choose yes or no");
    options.tailwind = ["yes", "y"].includes(tailwind.trim().toLowerCase());
  }
  const r = await fetch("/__cd/projects", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ root, ...options }) });
  const j = await r.json();
  if (!r.ok) return toast(j.error || "could not add folder");
  location.href = j.url;
}
async function projects() {
  const { current, projects: l, remote } = await (await fetch("/__cd/projects")).json();
  const sel = $("#proj");
  sel.innerHTML = "";
  for (const p of l) sel.add(new Option(p.name, p.url, false, p.id === current));
  if (!remote) sel.add(new Option("Add folder…", "#add"));
  if (current && !remote) sel.add(new Option("Close this project", "#close"));
  sel.onchange = async () => {
    if (sel.value === "#add") return addFolder();
    if (sel.value === "#close") { await fetch(`/__cd/projects/${current}/remove`, { method: "POST" }); return location.href = location.origin.replace(/^(https?:\/\/)[^.]+\.localhost/, "$1localhost"); }
    location.href = sel.value;
  };
  if (current) return current;
  document.body.classList.add("nop"); // bare localhost: pick a project
  const pk = $("#pick");
  pk.innerHTML = "<h2>cdesign</h2>";
  for (const p of l) { const b = document.createElement("button"); b.className = "f"; b.innerHTML = `${p.name}<br><small>${p.root}</small>`; b.onclick = () => (location.href = p.url); pk.appendChild(b); }
  const a = document.createElement("button"); a.textContent = "Add folder…"; a.onclick = addFolder; pk.appendChild(a);
  return null;
}
projects().then((cur) => { if (cur) start(); });
function start() {
const es = new EventSource("/__cd/events?tab=" + tabId);
es.onopen = report; // also after a reconnect: the server forgets a tab when its stream closes
es.onmessage = (e) => {
  if (e.data === "reload") $("#fr").contentWindow.location.reload(), view === "split" && $("#fr2").contentWindow.location.reload(), files();
  if (e.data === "comments") { comments(); send({ cd: "pins" }); agent(); }
  if (e.data === "agent") agent();
};
files().then(load); comments(); applyTheme(); agent();
}
</script>
