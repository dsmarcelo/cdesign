<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cdesign</title>
<style>
  :root{color-scheme:dark;--bg:#111113;--panel:#18181b;--line:#27272a;--mut:#a1a1aa;--acc:#2563eb}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:grid;grid-template-columns:var(--lw,230px) 1fr var(--rw,300px);grid-template-rows:44px 1fr;background:var(--bg);color:#fafafa;font:13px system-ui}
  header{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line)}
  header b{margin-right:auto}
  #agent{font-size:12px;color:var(--mut);margin-right:8px} #agent::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#52525b;margin-right:6px} #agent.on{color:#fafafa} #agent.on::before{background:#22c55e}
  button{background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
  button.on{background:var(--acc);border-color:var(--acc)}
  aside{overflow:auto;padding:8px;background:var(--panel)}
  aside.l{grid-area:2/1} main{grid-area:2/2} aside.r{grid-area:2/3}
  body.hl{--lw:0px} body.hr{--rw:0px} body.hl aside.l,body.hr aside.r{display:none}
  header button.ic{padding:5px 7px;line-height:0} header button.ic svg{width:16px;height:16px}
  aside.l{border-right:1px solid var(--line)} aside.r{border-left:1px solid var(--line)}
  details{margin:0}
  summary{list-style:none;cursor:pointer;padding:6px 8px;border-radius:6px;color:#fafafa;font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px;user-select:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--mut);border-bottom:1.5px solid var(--mut);transform:rotate(-45deg);transition:transform .12s;margin:0 2px}
  details[open]>summary::before{transform:rotate(45deg)}
  summary:hover{background:var(--line)}
  .kids{margin-left:10px;padding-left:6px;border-left:1px solid var(--line)}
  .f{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;color:var(--mut)}
  .f:hover,.f.sel{background:var(--line);color:#fff}
  main{display:flex;justify-content:center;overflow:auto;padding:12px}
  iframe{border:1px solid var(--line);background:#fff;border-radius:8px;height:100%;width:100%}
  .c{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
  .c small{display:block;color:var(--mut);font-size:11px;margin-bottom:4px;word-break:break-all}
  .c.done{opacity:.45}
  .c button{padding:2px 8px;margin-top:6px;margin-right:4px;font-size:11px}
  .st{font-size:10px;text-transform:uppercase;color:var(--acc)}
  .c.queued .st,.c.sent .st{color:var(--mut)}
  button.go{background:var(--acc);border-color:var(--acc)} button:disabled{opacity:.4;cursor:default}
  select{background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;max-width:220px}
  #pick{position:fixed;inset:0;background:var(--bg);display:none;place-content:center;gap:8px;padding:24px;z-index:9;width:min(480px,100%);margin:auto;align-content:center}
  body.nop #pick{display:grid} body.nop>:not(#pick):not(#toast){display:none}
  #pick h2{margin:0 0 8px;font-size:16px} #pick .f{border:1px solid var(--line);color:#fafafa} #pick small{color:var(--mut)}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#fafafa;color:#111;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw}
  #toast.on{opacity:1}
</style>
<header>
  <button id="tl" class="ic on" title="Hide/show files"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M6 3v10"/></svg></button>
  <b>cdesign</b>
  <select id="proj" title="Switch project"></select>
  <span id="agent" title="Is an agent running `cdesign wait`?"></span>
  <button id="w" title="Preview width">Full</button>
  <button id="theme" title="Toggle light/dark preview">Light</button>
  <button id="sel" class="ic" title="Select element for the agent (S)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3.5 2.5l9 4.2-3.9 1.3-1.3 3.9z"/><path d="M8.6 8l3 3.2"/></svg></button>
  <button id="mode">Comment (C)</button>
  <button id="send" class="go" disabled>Send to agent</button>
  <button id="tr" class="ic on" title="Hide/show comments"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M10 3v10"/></svg></button>
</header>
<aside class="l" id="files"></aside>
<main><iframe id="fr"></iframe></main>
<aside class="r" id="cm"></aside>
<div id="pick"></div>
<div id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
let cur = location.hash.slice(1) || null, mode = null; // mode: null | "select" | "comment"
const tabId = Math.random().toString(36).slice(2, 10);
// tell the server which page this tab shows; the agent reads it through `cdesign page`
const report = () => fetch("/__cd/page", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ tabId, file: cur }), keepalive: true }).catch(() => {});
function setCur(p) { cur = p; if (location.hash.slice(1) !== p) location.hash = p; files(); load(); report(); }
const widths = [["Full", "100%"], ["Tablet", "768px"], ["Mobile", "390px"]];
let wi = 0;

const closed = new Set(JSON.parse(localStorage.getItem("cd-closed") || "[]"));
const saveClosed = () => localStorage.setItem("cd-closed", JSON.stringify([...closed]));

function tree(list) {
  const root = { dirs: {}, files: [] };
  for (const f of list) {
    const parts = f.split("/"), name = parts.pop();
    let n = root;
    for (const p of parts) n = n.dirs[p] ??= { dirs: {}, files: [] };
    n.files.push({ name, path: f });
  }
  return root;
}

function draw(n, el, prefix) {
  for (const [name, d] of Object.entries(n.dirs).sort(([a], [b]) => a.localeCompare(b))) {
    let label = name, node = d;
    while (!node.files.length && Object.keys(node.dirs).length === 1) { // compact single-child chains
      const [k, v] = Object.entries(node.dirs)[0];
      label += "/" + k; node = v;
    }
    const key = prefix + label;
    const det = document.createElement("details");
    det.open = !closed.has(key);
    det.ontoggle = () => { det.open ? closed.delete(key) : closed.add(key); saveClosed(); };
    const sum = document.createElement("summary");
    sum.textContent = label;
    const kids = document.createElement("div");
    kids.className = "kids";
    det.append(sum, kids);
    el.appendChild(det);
    draw(node, kids, key + "/");
  }
  for (const f of n.files.sort((a, b) => a.name.localeCompare(b.name))) {
    const b = document.createElement("button");
    b.className = "f" + (f.path === cur ? " sel" : "");
    b.textContent = f.name;
    b.title = f.path;
    b.onclick = () => setCur(f.path);
    el.appendChild(b);
  }
}

async function files() {
  const l = await (await fetch("/__cd/files")).json();
  const had = cur;
  if (!cur || !l.includes(cur)) cur = l[0] ?? null;
  if (cur !== had) report();
  $("#files").innerHTML = "";
  draw(tree(l), $("#files"), "");
  if (!l.length) $("#files").textContent = "No .html files";
}
const load = () => { if (cur) $("#fr").src = "/p/" + cur; };
const send = (m) => $("#fr").contentWindow?.postMessage(m, "*");
const sync = () => { send({ cd: "mode", mode, tab: tabId }); send({ cd: "pins" }); };

async function comments() {
  const l = await (await fetch("/__cd/comments")).json();
  const drafts = l.filter((c) => c.status === "draft").length;
  $("#send").disabled = !drafts;
  $("#send").textContent = drafts ? `Send to agent (${drafts})` : "Send to agent";
  $("#cm").innerHTML = l.length ? "" : '<small style="color:var(--mut)">No comments yet. Toggle Comment and click an element.</small>';
  for (const c of l) {
    const d = document.createElement("div");
    d.className = "c " + c.status;
    d.innerHTML = `<span class="st"></span><small></small><div></div>`;
    d.querySelector(".st").textContent = c.status;
    d.querySelector("small").textContent = `${c.file}:${c.cdId}`;
    d.querySelector("div").textContent = c.text;
    const mk = (t, p) => { const b = document.createElement("button"); b.textContent = t; b.onclick = () => fetch(`/__cd/comments/${c.id}/${p}`, { method: "POST" }); d.appendChild(b); };
    mk(c.status === "done" ? "Reopen" : "Done", c.status === "done" ? "open" : "done");
    mk("Delete", "delete");
    d.onclick = (e) => { if (e.target.tagName !== "BUTTON" && c.file !== cur) setCur(c.file); };
    $("#cm").appendChild(d);
  }
}

let agentOn = false;
async function agent() {
  agentOn = (await (await fetch("/__cd/agent")).json()).listening;
  const working = !agentOn && (await (await fetch("/__cd/comments")).json()).some((c) => c.status === "sent");
  $("#agent").className = agentOn ? "on" : "";
  $("#agent").textContent = agentOn ? "Agent listening" : working ? "Agent working" : "No agent listening";
}
const PROMPT = "Run `cdesign review` and apply the comments I sent in the cdesign viewer.";
function toast(t) { $("#toast").textContent = t; $("#toast").classList.add("on"); setTimeout(() => $("#toast").classList.remove("on"), 4000); }
$("#send").onclick = async () => {
  const { queued } = await (await fetch("/__cd/send", { method: "POST" })).json();
  let copied = false;
  try { await navigator.clipboard.writeText(PROMPT); copied = true; } catch {}
  await agent();
  toast(agentOn ? `${queued} comment(s) sent to the listening agent.` : `${queued} comment(s) queued, no agent is listening. ` + (copied ? "Prompt copied: paste it in your agent." : "Tell your agent: " + PROMPT));
};

const hidden = (k) => { try { return localStorage.getItem(k) === "1"; } catch { return false; } };
function panel(btn, cls, key, toggleIt) {
  if (toggleIt) { try { localStorage.setItem(key, hidden(key) ? "0" : "1"); } catch {} }
  document.body.classList.toggle(cls, hidden(key));
  $(btn).classList.toggle("on", !hidden(key));
}
$("#tl").onclick = () => panel("#tl", "hl", "cd-hide-l", true);
$("#tr").onclick = () => panel("#tr", "hr", "cd-hide-r", true);
panel("#tl", "hl", "cd-hide-l"); panel("#tr", "hr", "cd-hide-r");

const theme = () => { try { return localStorage.getItem("cd-theme"); } catch { return null; } };
const current = () => theme() || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function applyTheme() {
  const t = current();
  $("#theme").textContent = t === "dark" ? "Dark" : "Light";
  $("#theme").classList.toggle("on", t === "dark");
  try { $("#fr").contentDocument.documentElement.setAttribute("data-theme", t); } catch {}
}
$("#theme").onclick = () => {
  try { localStorage.setItem("cd-theme", current() === "dark" ? "light" : "dark"); } catch {}
  applyTheme();
};
function setMode(m) {
  mode = mode === m ? null : m;
  $("#mode").classList.toggle("on", mode === "comment");
  $("#sel").classList.toggle("on", mode === "select");
  if (mode !== "select") send({ cd: "clear" }); // the agent only sees a selection while Select is active
  sync();
}
$("#mode").onclick = () => setMode("comment");
$("#sel").onclick = () => setMode("select");
$("#w").onclick = () => { wi = (wi + 1) % widths.length; $("#w").textContent = widths[wi][0]; $("#fr").style.width = widths[wi][1]; };
addEventListener("keydown", (e) => {
  if (/input|textarea/i.test(e.target.tagName)) return;
  if (e.key === "c") setMode("comment");
  if (e.key === "s") setMode("select");
  if (e.key === "Escape") send({ cd: "clear" });
});
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== cur) setCur(h); });
addEventListener("focus", report);
document.addEventListener("visibilitychange", () => { if (!document.hidden) report(); });
addEventListener("message", (e) => { if (e.data?.cd === "ready") sync(); });
$("#fr").addEventListener("load", () => { sync(); applyTheme(); });

async function addFolder() {
  const root = prompt("Absolute path of the project folder");
  if (!root) return;
  const r = await fetch("/__cd/projects", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ root }) });
  const j = await r.json();
  if (!r.ok) return toast(j.error || "could not add folder");
  location.href = j.url;
}
async function projects() {
  const { current, projects: l } = await (await fetch("/__cd/projects")).json();
  const sel = $("#proj");
  sel.innerHTML = "";
  for (const p of l) sel.add(new Option(p.name, p.url, false, p.id === current));
  sel.add(new Option("Add folder…", "#add"));
  if (current) sel.add(new Option("Close this project", "#close"));
  sel.onchange = async () => {
    if (sel.value === "#add") return addFolder();
    if (sel.value === "#close") { await fetch(`/__cd/projects/${current}/remove`, { method: "POST" }); return location.href = location.origin.replace(/^(https?:\/\/)[^.]+\.localhost/, "$1localhost"); }
    location.href = sel.value;
  };
  if (current) return current;
  document.body.classList.add("nop"); // bare localhost: pick a project
  const pk = $("#pick");
  pk.innerHTML = "<h2>cdesign</h2>";
  for (const p of l) { const b = document.createElement("button"); b.className = "f"; b.innerHTML = `${p.name}<br><small>${p.root}</small>`; b.onclick = () => (location.href = p.url); pk.appendChild(b); }
  const a = document.createElement("button"); a.textContent = "Add folder…"; a.onclick = addFolder; pk.appendChild(a);
  return null;
}
projects().then((cur) => { if (cur) start(); });
function start() {
const es = new EventSource("/__cd/events?tab=" + tabId);
es.onopen = report; // also after a reconnect: the server forgets a tab when its stream closes
es.onmessage = (e) => {
  if (e.data === "reload") $("#fr").contentWindow.location.reload(), files();
  if (e.data === "comments") { comments(); send({ cd: "pins" }); agent(); }
  if (e.data === "agent") agent();
};
files().then(load); comments(); applyTheme(); agent();
}
</script>
