name: Desktop installers

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "install-desktop.sh"
      - "desktop/**"
      - "packaging/arch/**"
      - "src-tauri/**"
      - "src/**"
      - "ui/**"
      - "skills/**"
      - "package.json"
      - "bun.lock"
      - "tests/app.test.ts"

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun test tests/app.test.ts -t "desktop opens"
      - run: bun run desktop:build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: cdesign-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed git bun rust pkgconf dbus gtk3 hicolor-icon-theme webkit2gtk-4.1 xdg-utils xdotool
      - uses: actions/checkout@v4
      - name: Build and install the Arch package
        run: |
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -c 'cd packaging/arch && makepkg --noconfirm --clean'
          mv packaging/arch/cdesign-desktop-*-x86_64.pkg.tar.zst cdesign-desktop-x86_64.pkg.tar.zst
          pacman -U --noconfirm cdesign-desktop-x86_64.pkg.tar.zst
          pacman -Q cdesign-desktop
          cdesign-bun --version
      - uses: actions/upload-artifact@v4
        with:
          name: cdesign-arch-linux
          path: cdesign-desktop-x86_64.pkg.tar.zst
          if-no-files-found: error
  publish-arch:
    if: github.event_name == 'release'
    needs: arch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cdesign-arch-linux
      - run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" cdesign-desktop-x86_64.pkg.tar.zst
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
